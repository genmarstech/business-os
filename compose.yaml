# ─────────────────────────────────────────────────────────────────────────────
# Genmars Business Platform.
#
#   cd /opt/business-os
#   docker compose up -d --build
#   docker compose exec api python manage.py migrate
#   docker compose cp api:/app/staticfiles ./staticfiles   # ← every deploy
#
# That last line is not optional and not a one-off. Caddy serves the admin's
# CSS off /opt/business-os/staticfiles; the collectstatic output lives inside
# the image, so a rebuild that is not copied out leaves the previous deploy's
# assets on disk — or, the first time, none at all and an unstyled admin.
#
# ── THE .env SYMLINK IS NOT OPTIONAL ────────────────────────────────────────
# The environment lives at backend/.env, because that is what `env_file` below
# hands to the container. But compose reads its OWN interpolation variables —
# POSTGRES_PASSWORD in the db service and in DATABASE_URL — from a `.env` in
# the PROJECT ROOT, and finds nothing there. Every command in this directory
# then fails before it reaches Docker, including read-only ones like
# `docker compose ps`.
#
# The deployment makes `.env` a symlink to `backend/.env`. The alternative is
# prefixing every command with `set -a && . ./backend/.env && set +a`, and the
# step people forget is the one they need during an outage. If you have
# cloned this fresh:
#
#   ln -s backend/.env .env
#
# ⚠ db PUBLISHES NOTHING. It is reachable only across the internal network.
#   The api is published to 127.0.0.1 only, so Caddy is the single public way
#   in — see deploy/business.caddy.
# ─────────────────────────────────────────────────────────────────────────────

name: business-platform

services:
  db:
    image: postgres:17-alpine
    container_name: business-platform-db
    restart: unless-stopped

    # No `ports:` at all. Anything that needs this database is on this network.
    networks:
      - data

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-business_platform}
      POSTGRES_USER: ${POSTGRES_USER:-business_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    volumes:
      - business-platform-db:/var/lib/postgresql/data

    healthcheck:
      # The api waits on this. Without it the first boot races the database and
      # fails its own migration for a reason that looks like a code bug.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-business_platform}"]
      interval: 10s
      timeout: 5s
      retries: 10

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/genmarstech/business-platform-api:latest
    container_name: business-platform-api
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    networks:
      - data
      - edge

    env_file:
      - ./backend/.env

    environment:
      # Assembled here rather than written into .env, so the password lives in
      # exactly one place.
      DATABASE_URL: postgres://${POSTGRES_USER:-business_platform}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-business_platform}

    # ⚠ LOOPBACK ONLY. Do not change to "8020:8020".
    #
    # The moment this binds 0.0.0.0 the API is on the public internet with no
    # TLS and none of the headers Caddy adds — and X-Real-IP becomes whatever
    # the caller says it is, which is what identity/authentication.py trusts to
    # tell one caller from another.
    ports:
      - "127.0.0.1:8020:8020"

    # ── NO STATIC BIND MOUNT. THIS IS THE TRAP, NOT THE FIX ─────────────────
    #
    # `- ./staticfiles:/app/staticfiles:ro` looks like the obvious way to let
    # Caddy serve the admin's CSS. It is wrong. The image ALREADY contains the
    # collectstatic output, built at image build time; bind mounting the host
    # directory over that path MASKS it. On a fresh clone the host directory is
    # empty, so the container serves nothing, Caddy serves nothing, and the
    # admin renders unstyled — for a reason invisible in every log.
    #
    # Static files are copied OUT of the image instead, once per deploy:
    #
    #     docker compose cp api:/app/staticfiles ./staticfiles
    #
    # Explicit, ordinary to reason about, and it cannot silently hide the thing
    # it is meant to publish. deploy/business.caddy serves that directory.
    # gen-portal carries the identical note for the identical reason.

    # ── HARDENING ───────────────────────────────────────────────────────────
    #
    # read_only because nothing here writes to the image: PYTHONDONTWRITEBYTECODE
    # is set, static files are built into the image, and gunicorn's scratch dir
    # is /tmp, which the tmpfs supplies. An attacker who achieves execution
    # cannot leave anything behind that survives a restart.
    #
    # noexec on the tmpfs because /tmp is the obvious place to drop a binary
    # and run it, and nothing here executes out of it.
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ───────────────────────────────────────────────────────────────────────────
  # The web application.
  #
  # ⚠ API_ORIGIN IS SET TWICE, AND NEITHER IS REDUNDANT.
  #
  #   as a BUILD ARG  — next.config.ts resolves its rewrites at build time and
  #                     bakes them into routes-manifest.json. A runtime value
  #                     has no effect on them whatsoever.
  #   at RUNTIME      — frontend/src/lib/api.ts reads it per request, for
  #                     server-component fetches to Django.
  #
  # gen-portal shipped the half of this that looks fine: the variable present
  # and correct in `docker compose exec web env` the whole time it was doing
  # nothing, while every proxied call returned ECONNREFUSED.
  # ───────────────────────────────────────────────────────────────────────────
  web:
    build:
      context: ./frontend
      args:
        API_ORIGIN: http://api:8020
    image: ghcr.io/genmarstech/business-platform-web:latest
    restart: unless-stopped

    depends_on:
      api:
        condition: service_started

    networks:
      # `edge` only. The web container has no business reaching the database —
      # everything it knows comes through the API, which is what makes the
      # tenant scoping in identity/scoping.py the single gate it claims to be.
      - edge

    environment:
      API_ORIGIN: http://api:8020

    # ⚠ LOOPBACK ONLY, like the API. Caddy is the single public way in.
    ports:
      - "127.0.0.1:3030:3030"

    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Split so the database is not on the same network as anything that talks to
  # the outside world. Only `api` is on both, and it is the only thing that
  # needs to be.
  data:
    internal: true
  edge:


volumes:
  business-platform-db:
