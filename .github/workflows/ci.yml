name: ci

# Charter 03 §III: "CI runs on every push. A red pipeline blocks deploy — there
# is no manual override."
#
# business-os was the last of the four repositories with no pipeline at all.
# The backend suite — including the tests that prove one business cannot read
# another's takings — ran only when somebody remembered to run it, and the
# deployed instance had drifted five commits behind main without anything
# noticing. A suite nobody is obliged to run is a collection of scripts.
#
# It never touches the server. Deploys here are by hand; this is the gate that
# says the code is fit to deploy, not the thing that deploys it.

# ── THE BASE FILTER ON `pull_request` IS THE THING THAT WAS WRONG ───────────
#
# This said `pull_request: branches: [main]`, so a PR opened against any other
# branch got no pipeline at all — and a stacked PR, which is the change
# nobody has run against main yet, is exactly the one most worth checking.
# That is how #15 came to sit there reporting no checks, with "the suite
# passes" meaning "it passed on somebody's laptop" — the state the header
# above says this file was written to end.
#
# `push` stays filtered to main, and that is deliberate rather than an
# oversight. Widening it was tried: with both triggers unfiltered, every push
# to a branch with an open PR starts two runs, and the concurrency group
# below cancels one. A cancelled run is reported as a FAILED check, so the
# pull request shows a red cross beside the green one — on a repository whose
# rule is that a red pipeline blocks deploy, a check that is red by design is
# worse than the gap it closed.
#
# So: every pull request, whatever its base, and every push to main. A branch
# pushed with no pull request open is not under review by anybody.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# `head_ref` is the source branch on a pull_request and empty otherwise, so
# this names the branch for either trigger. `github.ref` does not: it is
# `refs/pull/<n>/merge` on a pull request and `refs/heads/<branch>` on a push,
# which put the same branch in two groups.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # ── THE SUITE RUNS ON THE DATABASE IT SHIPS ON ──────────────────────────
    #
    # settings.py refuses to boot on SQLite with DEBUG off, and says why: "Two
    # tills writing at the same moment is the normal case for a POS, and SQLite
    # has no answer for it." Then RUNNING_TESTS exempts the test runner from
    # that refusal — so for the life of this repository the suite has been run
    # against a database the application itself is not allowed to use.
    #
    # 17-alpine matches compose.yaml. A suite green on a different major
    # version is a weaker claim than it looks.
    #
    # ── THE REGISTRY IS A MIRROR AND THE TAG IS NOT ─────────────────────────
    #
    # mirror.gcr.io is a read-through cache of Docker Hub, so this is the same
    # postgres:17-alpine the sentence above is about, fetched from somewhere
    # that does not count pulls per IP.
    #
    # Docker Hub does, and GitHub's hosted runners share an IP with every
    # other repository building on them. This job failed twice in three
    # minutes on `toomanyrequests: You have reached your unauthenticated pull
    # rate limit` with a green suite behind it — a red check that says nothing
    # about the code, which the header of this file argues is worse than none.
    #
    # The alternative is a Docker Hub account and two repository secrets. That
    # buys a per-account limit instead of a per-IP one and is the better answer
    # the day this mirror is not enough; it is not needed yet, and a secret
    # nobody has to rotate is a secret that cannot leak.
    #
    # A service container cannot take a build argument, so unlike the two
    # Dockerfiles this is written out rather than parameterised. Nothing
    # deploys from here — compose.yaml on the host still names Docker Hub.
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        # Without this the suite races the database on a cold runner and fails
        # its first connection for a reason that reads like a code bug.
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          # MUST match backend/Dockerfile. The day that moves and this does
          # not, CI is testing a runtime nothing ships on.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # DATABASE_URL is what selects Postgres — see the block in settings.py.
      # Without it Django falls back to SQLite silently, and this job goes back
      # to proving nothing about the database production uses while still
      # reporting green. That is the failure worth guarding, because it looks
      # exactly like success.
      - name: Tests
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
        run: python manage.py test --verbosity 2

      # `check --deploy` reads configuration; it does not open the database.
      # Without a DSN, settings.py refuses to boot at all and the check never
      # runs — which would look like a pass.
      #
      # It points at the service container above, which is now genuinely
      # listening. That is incidental rather than required: this step would
      # pass against an address with nothing on it, and saying otherwise would
      # invite somebody to delete the service and wonder why only the tests
      # broke.
      #
      # ⚠ RESEND_API_KEY IS SET HERE AND THAT IS NOT A WORKAROUND TO DELETE.
      #
      # settings.py uses the key itself as the switch: present, and MAILERS
      # points at the Resend backend; absent, and it stays on the console
      # backend, for which `check --deploy` reports mail.E001. That report is
      # TRUE and deliberately not silenced — with no key nothing can send.
      #
      # It cannot also be this job's verdict. The check would fail on every
      # commit made from a machine without a key, and a pipeline that is
      # always red is one everybody learns to ignore — worse than none.
      #
      # A dummy key rather than an EMAIL_BACKEND override, deliberately: it
      # exercises the SAME selection path production takes, so the day that
      # logic breaks CI notices. Nothing is sent; no message is constructed in
      # this job at all.
      - name: A production configuration boots
        env:
          DEBUG: "False"
          DJANGO_SECRET_KEY: ci-only-fifty-characters-of-nothing-in-particular-here
          ALLOWED_HOSTS: business.genmars.co.ke
          CSRF_TRUSTED_ORIGINS: https://business.genmars.co.ke
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
          RESEND_API_KEY: ci-not-a-real-key-nothing-is-sent
        run: python manage.py check --deploy --fail-level WARNING

      # A model changed and nobody made the migration. Caught here rather than
      # at the moment somebody runs migrate against the live database.
      #
      # It needs the same environment: settings.py refuses to boot without a
      # secret key whenever DEBUG is off, and `makemigrations` — unlike `test`,
      # which is exempt by RUNNING_TESTS — is not excused from that.
      #
      # Repeated in full, NOT a YAML anchor: GitHub Actions does not support
      # anchors or aliases in workflow files, and the parser's failure for one
      # is not a helpful message. Four duplicated lines beat a workflow that
      # will not load.
      - name: No missing migrations
        env:
          DEBUG: "False"
          DJANGO_SECRET_KEY: ci-only-fifty-characters-of-nothing-in-particular-here
          ALLOWED_HOSTS: business.genmars.co.ke
          CSRF_TRUSTED_ORIGINS: https://business.genmars.co.ke
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
          RESEND_API_KEY: ci-not-a-real-key-nothing-is-sent
        run: python manage.py makemigrations --check --dry-run

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          # MUST match frontend/Dockerfile, same reasoning as the Python pin.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      # `verify` is check:theme && typecheck && build. Lint is a separate
      # script here and is NOT in it, so running verify alone would leave the
      # linter running nowhere.
      - run: npm run lint
      - run: npm run verify

  image:
    name: images build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # Built, never pushed. This repository has no registry step: deploys
      # build on the host. What this catches is a Dockerfile that stopped
      # working, which is otherwise discovered during a deploy — the worst
      # moment to discover it.
      #
      # REGISTRY is why these two pull from a mirror; both Dockerfiles explain
      # it at the ARG, and both default to Docker Hub so a deploy that does not
      # pass it builds exactly what it always did.
      - name: Backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          build-args: |
            REGISTRY=mirror.gcr.io/library
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          build-args: |
            REGISTRY=mirror.gcr.io/library
          cache-from: type=gha
          cache-to: type=gha,mode=max
